zerops:
  - setup: xui
    run:
      base: docker@latest
      prepareCommands:
        - docker image pull ghcr.io/mhsanaei/3x-ui:latest
      start: docker run --network=host -e XRAY_VMESS_AEAD_FORCED=false -v /home/zerops/db:/etc/x-ui ghcr.io/mhsanaei/3x-ui:latest
            ports:
        - port: 2053
          httpSupport: true
        - port: 8081
          httpSupport: true
